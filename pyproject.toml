[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "map3d"
version = "2.0.0"
description = "Argonaut: web service for 3D interstellar dust maps"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "astropy",
    "Cerberus>=1.3,<2",
    "Flask>=3.1",
    "Flask-Compress",
    "geoip2",
    "gunicorn",
    "h5py",
    "healpy",
    "maxminddb",
    "numpy",
    "pillow",
    "Pygments",
    "requests",
    "scipy",
    "tqdm",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-timeout", "ruff"]

[tool.setuptools.packages.find]
include = ["map3d*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: hits a running deployment (run with: pytest -m live)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
# E741: `l` and `b` are the standard names for Galactic coordinates.
ignore = ["E501", "E741"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
"tests/conftest.py" = ["E402"]
